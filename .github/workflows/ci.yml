name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vitrine
          POSTGRES_PASSWORD: vitrine
          POSTGRES_DB: vitrine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitrine"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vitrine:vitrine@localhost:5432/vitrine_test
      DATABASE_URL_TEST: postgresql://vitrine:vitrine@localhost:5432/vitrine_test
      JWT_SECRET: segredo-do-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  web:
    name: Web (lint, testes e build sem API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # API propositalmente inexistente: o build precisa passar mesmo com ela fora do ar
      NEXT_PUBLIC_API_URL: http://localhost:9
      NEXT_PUBLIC_SITE_URL: https://exemplo.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
