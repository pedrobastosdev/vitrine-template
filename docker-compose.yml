services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vitrine
      POSTGRES_PASSWORD: vitrine
      POSTGRES_DB: vitrine
    ports:
      - '5440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vitrine']
      interval: 5s
      timeout: 3s
      retries: 10

  # Banco descartável só para os testes e2e (dados em memória)
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vitrine
      POSTGRES_PASSWORD: vitrine
      POSTGRES_DB: vitrine_test
    ports:
      - '5441:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vitrine']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
